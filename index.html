<!DOCTYPE html>
<html>
<head>
<title>Employee Validation</title>
</head>
<body>

<h2>Employee Validation</h2>

<input type="text" id="empno" placeholder="Enter Employee Number">
<button onclick="validate()">Validate</button>

<p id="result"></p>

<script>
function validate() {
    var empno = document.getElementById("empno").value;

    fetch("https://spimacos-my.sharepoint.com/:x:/g/personal/mohammed_insaf_spimaco_sa/IQC5CMtE7KyZQZLjfux9GcVSAWLCGR38nU7ImYznYe06u54?e=7VfS4U", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ empno: empno })
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("result").innerHTML =
            "Name: " + data.Name + "<br>" +
            "Department: " + data.Department + "<br>" +
            "Status: " + data.Status;
    })
    .catch(error => {
        document.getElementById("result").innerHTML = "Employee Not Found";
    });
}
</script>

</body>
</html>
