<!DOCTYPE html>
<html>
<head>
<title>Employee Validation</title>
</head>
<body>

<h2>Employee Validation</h2>

<input type="text" id="empno" placeholder="Enter Employee Number">
<button onclick="validate()">Validate</button>

<p id="result"></p>

<script>
function validate() {
    var empno = document.getElementById("empno").value;

    fetch("https://spimacos-my.sharepoint.com/:x:/r/personal/mohammed_insaf_spimaco_sa/_layouts/15/doc2.aspx?sourcedoc=%7B44CB08B9-ACEC-4199-92E3-7EEC7D19C552%7D&file=Book.xlsx&action=editNew&mobileredirect=true&wdOrigin=POWERAPPSPORTAL.SHELL%2CAPPHOME-WEB.UNAUTH%2CAPPHOME-WEB.BANNER.NEWBLANK&wdPreviousSession=d22cfd8c-f07e-4ae6-a9b1-ae38841647e2&wdPreviousSessionSrc=AppHomeWeb&ct=1770881205998", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ empno: empno })
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("result").innerHTML =
            "Name: " + data.Name + "<br>" +
            "Department: " + data.Department + "<br>" +
            "Status: " + data.Status;
    })
    .catch(error => {
        document.getElementById("result").innerHTML = "Employee Not Found";
    });
}
</script>

</body>
</html>
